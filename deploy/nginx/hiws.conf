# ==========================================================================
# HiWS — main site and project subdomains
#
# The whole subdomain layout lives in this file. There is one server block per
# project, each with its own document root and its own routing; the project
# folders themselves carry no .htaccess. Adding a project means adding a block
# here and its name to PROJECTS in app/projects.php.
#
# The projects are separate homes:
#   tools.hiws.dev  -> /var/www/hiws/tools   (/bmi -> bmi.php)
#   bible.hiws.dev  -> /var/www/hiws/bible   (/john/3 -> read.php?book=john&chapter=3)
#   sifm.hiws.dev   -> /var/www/hiws/sifm    (project home, then /sifm.php)
#
# hiws.dev is the one canonical domain. hiws.eu.org and hiws.us.ci are kept as
# aliases: their apex and www names redirect to hiws.dev, and their project
# subdomains redirect to the same project on hiws.dev. One certificate at
# letsencrypt/live/hiws.dev covers all three apex names and one wildcard each.
# It is renewed with DNS-01 through the Cloudflare credentials in
# /root/.secrets/cloudflare.ini.
#
# Routing uses `rewrite ... last`, never `try_files ... $uri.php`: a static
# try_files match would hand the browser the PHP source instead of running it.
# `last` re-enters location matching, so the shared PHP handler in
# snippets/php-site.conf executes the script.
# ==========================================================================

# Visitor identity and the sign-in throttle.
#
# Cloudflare fronts every vhost, so $remote_addr is one of its edge addresses
# and cannot tell two visitors apart (the access log proves it: every line is
# a 172.69.x or 104.22.x address). Trust CF-Connecting-IP only from
# Cloudflare's own ranges — https://www.cloudflare.com/ips-v4 and /ips-v6 —
# and $remote_addr becomes the real client: SiFM's own sign-in throttle and
# the access log both key on the visitor, while a direct hit on the origin,
# which is outside those ranges, keeps its true address instead of a forged
# header.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# HTTP: every name goes to HTTPS.
server {
    listen 80;
    listen [::]:80;

    server_name hiws.dev *.hiws.dev hiws.eu.org *.hiws.eu.org hiws.us.ci *.hiws.us.ci;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hiws;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------------
# Main site: hiws.dev and www.hiws.dev
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name hiws.dev www.hiws.dev;

    ssl_certificate /etc/letsencrypt/live/hiws.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hiws.dev/privkey.pem;

    root /var/www/hiws;
    index index.php index.html;

    access_log /var/log/nginx/hiws-access.log;
    error_log /var/log/nginx/hiws-error.log;

    # A project has one address now: the old /tools, /bible and /sifm paths
    # keep their path and query and go to the project's own host. This sits in
    # nginx rather than .htaccess so the server owns the subdomain layout.
    location ~ ^/(?<project>tools|bible|sifm)(?<rest>/.*)?$ {
        return 301 https://$project.hiws.dev$rest$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    include /etc/nginx/snippets/php-site.conf;
}

# --------------------------------------------------------------------------
# hiws.eu.org and hiws.us.ci are aliases of hiws.dev
#
# The certificate covers all three names, but only hiws.dev is canonical. The
# aliases redirect so search engines never see two copies of a page.
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name hiws.eu.org www.hiws.eu.org hiws.us.ci www.hiws.us.ci;

    ssl_certificate /etc/letsencrypt/live/hiws.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hiws.dev/privkey.pem;

    return 301 https://hiws.dev$request_uri;
}

# Project subdomains on an alias domain keep their project and path:
# tools.hiws.eu.org/bmi -> tools.hiws.dev/bmi.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name ~^(?<subdomain>[a-z0-9-]+)\.hiws\.(?:eu\.org|us\.ci)$;

    ssl_certificate /etc/letsencrypt/live/hiws.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hiws.dev/privkey.pem;

    return 301 https://$subdomain.hiws.dev$request_uri;
}

# --------------------------------------------------------------------------
# tools.hiws.dev
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name tools.hiws.dev;

    ssl_certificate /etc/letsencrypt/live/hiws.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hiws.dev/privkey.pem;

    root /var/www/hiws/tools;
    index index.php index.html;

    access_log /var/log/nginx/hiws-access.log;
    error_log /var/log/nginx/hiws-error.log;

    # The CSS, fonts and images live once, on the main tree. Serving them from
    # /assets/ here keeps them on the project's own origin, which matters for
    # the Font Awesome webfonts; a cross-origin font request would be blocked.
    location ^~ /assets/ {
        root /var/www/hiws;
    }

    location / {
        try_files $uri $uri/ @tools;
    }

    # One file per tool: /bmi is bmi.php. The PHP handler in php-site.conf
    # checks that the file exists and answers 404 when it does not.
    location @tools {
        rewrite ^/([a-z][a-z0-9-]*)/?$ /$1.php last;
    }

    # A missing page inside a project gets the same tidy 404 as the main site.
    error_page 404 /404.php;

    location = /404.php {
        root /var/www/hiws;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    include /etc/nginx/snippets/php-site.conf;
}

# --------------------------------------------------------------------------
# bible.hiws.dev
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name bible.hiws.dev;

    ssl_certificate /etc/letsencrypt/live/hiws.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hiws.dev/privkey.pem;

    root /var/www/hiws/bible;
    index index.php index.html;

    access_log /var/log/nginx/hiws-access.log;
    error_log /var/log/nginx/hiws-error.log;

    location ^~ /assets/ {
        root /var/www/hiws;
    }

    location / {
        try_files $uri $uri/ @bible;
    }

    # The four named pages first, so "search" is a page and not a book. A
    # rewrite keeps ?v=KJV|WEB, so the translation follows a reader from page
    # to page. /<book>[/<chapter>[/<verse>]] reaches read.php as a query
    # value, which is what the reads in app/data.php expect.
    location @bible {
        rewrite ^/search/?$ /search.php last;
        rewrite ^/facts/?$  /facts.php  last;
        rewrite ^/jics/?$   /jics.php   last;
        rewrite ^/([A-Za-z0-9-]+)/([0-9]+)/([0-9]+)/?$ /read.php?book=$1&chapter=$2&verse=$3 last;
        rewrite ^/([A-Za-z0-9-]+)/([0-9]+)/?$ /read.php?book=$1&chapter=$2 last;
        rewrite ^/([A-Za-z0-9-]+)/?$ /read.php?book=$1 last;
    }

    error_page 404 /404.php;

    location = /404.php {
        root /var/www/hiws;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    include /etc/nginx/snippets/php-site.conf;
}

# --------------------------------------------------------------------------
# sifm.hiws.dev
#
# The root of the host is the project's own home page (index.php), which tells
# visitors what SiFM is and then sends them to the manager. The manager runs
# from demo/index.php, a wrapper that switches on read-only mode and hides the
# credential reminder before it loads sifm.php; .htaccess refuses /sifm.php
# over HTTP, so the wrapper cannot be bypassed by asking for the script
# directly. Only those three scripts execute. Managed/demo file content is
# streamed through SiFM's handlers (?view, ?download) and direct access to
# managed paths is denied, so files in scope are not directly fetchable by URL.
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name sifm.hiws.dev;

    ssl_certificate /etc/letsencrypt/live/hiws.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hiws.dev/privkey.pem;

    root /var/www/hiws/sifm;
    index index.php;

    access_log /var/log/nginx/hiws-access.log;
    error_log /var/log/nginx/hiws-error.log;

    # The CSS, fonts and images live once, on the main tree, so the project
    # home keeps its stylesheets on its own origin.
    location ^~ /assets/ {
        root /var/www/hiws;
    }

    # The project home, the demo wrapper and the manager itself are the only
    # scripts that run.
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /sifm.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # The demo wrapper: the same manager, loaded with SIFM_READONLY and
    # SIFM_CREDENTIAL_WARNING set by demo/index.php before sifm.php runs.
    # .htaccess refuses /sifm.php itself, so this is the only way in.
    location = /demo/index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Listed before the shared include, so it wins over its general PHP
    # handler for everything except the three exact scripts above.
    location ~ \.php$ {
        deny all;
    }

    # Managed/demo content is streamed through SiFM handlers (?view, ?download),
    # never served directly — SIFM_HOME may live outside the web root and direct
    # URLs must not reach files in scope. (The exact /demo/index.php location
    # above takes precedence over this prefix block.)
    location ^~ /demo/ {
        deny all;
    }

    location ^~ /home/ {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.php;

    location = /404.php {
        root /var/www/hiws;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    include /etc/nginx/snippets/php-site.conf;
}

# --------------------------------------------------------------------------
# Any other hiws.dev subdomain answers 404 rather than borrowing the main
# site. Alias subdomains have already been redirected to hiws.dev above.
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name ~^[a-z0-9-]+\.hiws\.dev$;

    ssl_certificate /etc/letsencrypt/live/hiws.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hiws.dev/privkey.pem;

    return 404;
}
